[project]
name = "three-point-tracker"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "altair>=6.3.0",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "psycopg2-binary>=2.9.13",
    "sqlalchemy>=2.1.9",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
pythonpath = ["."]
